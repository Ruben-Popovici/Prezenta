<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Entries</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --accent: #0071e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 40px 24px;
  }
  .wrap {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 14px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 12px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: #fafafa;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  #empty, #loading {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  #count {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Entries <span id="count">0</span></h1>
  <p class="sub">Live list — updates automatically as people submit.</p>
  <div class="card">
    <div id="loading">Loading...</div>
    <table id="table" style="display:none;">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" style="display:none;">No entries yet.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ====== PASTE THE SAME FIREBASE CONFIG AS index.html ======
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  // ============================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const tableEl = document.getElementById("table");
  const headerRow = document.getElementById("headerRow");
  const rowsEl = document.getElementById("rows");
  const loadingEl = document.getElementById("loading");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");

  let headersBuilt = false;

  const q = query(collection(db, "entries"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    loadingEl.style.display = "none";
    countEl.textContent = snapshot.size;

    if (snapshot.empty) {
      tableEl.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";
    tableEl.style.display = "table";

    rowsEl.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const fieldNames = Object.keys(data).filter(k => k !== "createdAt");

      // Build header row once, from the first entry's fields
      if (!headersBuilt) {
        headerRow.innerHTML = "";
        fieldNames.forEach(name => {
          const th = document.createElement("th");
          th.textContent = name;
          headerRow.appendChild(th);
        });
        const thTime = document.createElement("th");
        thTime.textContent = "Submitted";
        headerRow.appendChild(thTime);
        headersBuilt = true;
      }

      const tr = document.createElement("tr");
      fieldNames.forEach(name => {
        const td = document.createElement("td");
        td.textContent = data[name] || "";
        tr.appendChild(td);
      });
      const tdTime = document.createElement("td");
      tdTime.textContent = data.createdAt
        ? data.createdAt.toDate().toLocaleString()
        : "—";
      tr.appendChild(tdTime);

      rowsEl.appendChild(tr);
    });
  }, (err) => {
    loadingEl.textContent = "Error loading entries: " + err.message;
  });
</script>
</body>
</html>
